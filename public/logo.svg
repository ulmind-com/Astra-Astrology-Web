<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <radialGradient id="sacredAura" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#fffbeb" stop-opacity="0.95"/>
      <stop offset="25%" stop-color="#fef08a" stop-opacity="0.9"/>
      <stop offset="55%" stop-color="#f59e0b" stop-opacity="0.85"/>
      <stop offset="85%" stop-color="#ea580c" stop-opacity="0.75"/>
      <stop offset="100%" stop-color="#9a3412" stop-opacity="0.3"/>
    </radialGradient>
    <linearGradient id="goldGleam" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fef08a"/>
      <stop offset="40%" stop-color="#fbbf24"/>
      <stop offset="70%" stop-color="#d97706"/>
      <stop offset="100%" stop-color="#92400e"/>
    </linearGradient>
    <linearGradient id="shatkonaGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#fef3c7"/>
      <stop offset="50%" stop-color="#f59e0b"/>
      <stop offset="100%" stop-color="#b45309"/>
    </linearGradient>
  </defs>

  <!-- Outer Protective Celestial Chakra Ring -->
  <circle cx="256" cy="256" r="236" fill="none" stroke="url(#goldGleam)" stroke-width="6" stroke-dasharray="10 6" opacity="0.85"/>
  <circle cx="256" cy="256" r="220" fill="none" stroke="url(#goldGleam)" stroke-width="14" opacity="0.95"/>
  <circle cx="256" cy="256" r="202" fill="none" stroke="url(#goldGleam)" stroke-width="4" opacity="0.8"/>

  <!-- 12 Radiant Zodiac Petals (Dwadash Adityas) -->
  <g stroke="url(#goldGleam)" stroke-width="3" fill="none" opacity="0.85">
    <circle cx="256" cy="46" r="10" fill="url(#goldGleam)"/>
    <circle cx="361" cy="74" r="9" fill="url(#goldGleam)"/>
    <circle cx="438" cy="151" r="9" fill="url(#goldGleam)"/>
    <circle cx="466" cy="256" r="10" fill="url(#goldGleam)"/>
    <circle cx="438" cy="361" r="9" fill="url(#goldGleam)"/>
    <circle cx="361" cy="438" r="9" fill="url(#goldGleam)"/>
    <circle cx="256" cy="466" r="10" fill="url(#goldGleam)"/>
    <circle cx="151" cy="438" r="9" fill="url(#goldGleam)"/>
    <circle cx="74" cy="361" r="9" fill="url(#goldGleam)"/>
    <circle cx="46" cy="256" r="10" fill="url(#goldGleam)"/>
    <circle cx="74" cy="151" r="9" fill="url(#goldGleam)"/>
    <circle cx="151" cy="74" r="9" fill="url(#goldGleam)"/>
  </g>

  <!-- Sacred Inner Starburst Ring -->
  <circle cx="256" cy="256" r="180" fill="url(#sacredAura)" opacity="0.25"/>
  <circle cx="256" cy="256" r="172" fill="none" stroke="url(#goldGleam)" stroke-width="4" stroke-dasharray="4 8"/>

  <!-- Sacred Shatkona (Hexagram / Meru Yantra Star) -->
  <!-- Upward Triangle (Shiva / Divine Consciousness) -->
  <polygon points="256,92 388,320 124,320" fill="none" stroke="url(#shatkonaGrad)" stroke-width="12" stroke-linejoin="round"/>
  <!-- Downward Triangle (Shakti / Sacred Creation) -->
  <polygon points="256,420 388,192 124,192" fill="none" stroke="url(#shatkonaGrad)" stroke-width="12" stroke-linejoin="round"/>

  <!-- Inner Concentric Golden Ring -->
  <circle cx="256" cy="256" r="82" fill="none" stroke="url(#goldGleam)" stroke-width="7" opacity="0.95"/>
  <circle cx="256" cy="256" r="70" fill="none" stroke="#fff" stroke-width="2" opacity="0.7"/>

  <!-- Sacred Vedic Om (ॐ) Core in High-Contrast Radiant Gold -->
  <g transform="translate(186, 172) scale(0.68)" fill="url(#goldGleam)">
    <path d="M102 38 C90 38 78 44 70 54 C66 43 56 38 42 38 C20 38 4 54 4 76 C4 96 18 110 36 118 C18 128 6 146 6 170 C6 202 32 228 72 228 C108 228 132 208 140 182 L112 174 C106 190 92 202 72 202 C48 202 34 186 34 168 C34 148 50 134 76 134 L92 134 L92 110 L76 110 C58 110 32 102 32 76 C32 64 42 58 52 58 C66 58 76 68 78 84 L106 84 C104 56 94 38 102 38 Z" fill="#fbbf24"/>
    <path d="M104 90 C124 90 148 104 156 128 C166 106 184 92 206 92 C236 92 258 116 258 148 C258 196 204 228 152 258 L168 280 C228 246 290 206 290 148 C290 98 252 64 204 64 C176 64 150 78 136 102 C132 94 122 90 104 90 Z" fill="#f59e0b"/>
    <!-- Bindu and Chandrabindu (Sacred Crescent & Star) -->
    <path d="M164 36 C190 36 212 48 222 66 C214 62 198 60 184 60 C162 60 146 68 138 76 C144 52 152 36 164 36 Z" fill="#fef08a"/>
    <circle cx="184" cy="22" r="12" fill="#fff"/>
  </g>
</svg>
